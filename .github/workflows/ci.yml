name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck and build (web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: news-site/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Must satisfy the `engines` field in news-site/web/package.json,
          # which requires Node 20 or newer for Next.js 16.
          node-version: 22
          cache: npm
          cache-dependency-path: news-site/web/package-lock.json

      - name: Install dependencies
        # `ci` rather than `install`: installs exactly the lockfile, so CI
        # cannot pass against a different dependency tree than the one committed.
        run: npm ci

      - name: Generate route types
        # `LayoutProps` and `PageProps` are generated by Next, not written by
        # hand. Locally they already exist in .next/types from a previous dev or
        # build run; on a clean checkout they do not, so tsc fails with
        # "Cannot find name 'LayoutProps'" before it checks anything real.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # Prerenders every route, so this also catches runtime errors in server
        # components and broken GROQ queries — not just type errors.
        # Reaches the public Sanity API and Google Fonts during the build.
        run: npm run build

  cms:
    name: Typecheck, test and build (cms)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: news-site/cms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Payload 3.92 requires ^22.23.4 or >=24.22.1.
          node-version: 24
          cache: npm
          cache-dependency-path: news-site/cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Throwaway secrets for this run
        # Generated per run; nothing secret is stored in the repository.
        run: |
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DATABASE_URL=file:./ci.db" >> "$GITHUB_ENV"

      - name: Generated files are up to date
        # payload-types.ts and the admin import map must be regenerated and
        # committed whenever collections change.
        run: |
          npm run generate:types
          npm run generate:importmap
          git diff --exit-code -- src/payload-types.ts "src/app/(payload)/admin/importMap.js"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Integration tests
        run: npm test

      - name: Build
        run: npm run build

      # The production-style start-up check (committed migrations, then the real
      # server) runs against Postgres in the next job: the migrations are
      # Postgres-only, because Postgres is what production uses.

  cms-postgres:
    name: Test on Postgres (cms)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: news-site/cms

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cms_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: news-site/cms/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Throwaway secrets for this run
        # A throwaway database server that exists only for this job.
        run: |
          echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"

      - name: Integration tests on Postgres
        # Each test file creates its own empty Postgres database.
        run: npm test

      - name: Build
        run: npm run build

      - name: Production start smoke test
        # Tests let Payload create tables itself; production never does. This
        # proves the committed migrations build a working database from empty
        # and that the public API only exposes what it should (a gap that once
        # returned 500 because tables were missing).
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/cms_smoke
        run: |
          npm run migrate
          npx next start -p 3200 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3200/api/articles && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/api/articles)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/api/users)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/api/newsletter-subscribers)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200/api/graphql-playground)" = 404
